<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Please Wait...</title>
        <link rel="stylesheet" href="./css/puyow.css"/>
        <link rel="manifest" href="manifest.webmanifest"/>
        <!-- FIREBASE (Not needed for playing only) -->
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.19.0/firebase-performance-compat.js"></script>
        <!--<script defer src="/__/firebase/init.js?useEmulator=true"></script>-->
        <script defer src="./js/firebaseinit.js"></script>
        <!-- // FIREBASE (Not needed for playing only) -->
    </head>
    <body class="webpuyo">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const loadEl = document.querySelector('#load');
                try {
                    let app = firebase.app();
                    let features = [
                        'analytics', 
                        'performance'
                    ].filter(feature => typeof app[feature] === 'function');
                    firebase.analytics();
                    firebase.performance();
                    loadEl.textContent = `Firebase SDK loaded with ${features.join(', ')}`;
                } catch (e) {
                    console.error(e);
                    loadEl.textContent = 'Error loading the Firebase SDK, check the console.';
                }

                setTimeout(function() { location.href = 'puyow.html'; }, 2000);
            });
        </script>
        <div style="text-align: center; margin-top: 200px; width: 100%;">
            <span id="load" style="color: rgb(150, 150, 150);"></span><br/>
            <span style="font-weight: bold; font-size: 2rem;">Please Wait...</span>
        </div>
        <progress style="position: fixed; bottom: 0px; left: 0px; width: 100%;"></progress>
    </body>
</html>
