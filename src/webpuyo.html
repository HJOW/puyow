        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic&family=Nanum+Gothic+Coding&family=Noto+Sans+JP:wght@100..900&family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&display=swap" rel="stylesheet"/>
        <!-- // Google Fonts -->

        <!-- Google Ads 관련 -->
        <script src="//imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
        <!-- // Google Ads 관련 -->

        <!-- Game 관련 -->
        <link rel="manifest" href="manifest.webmanifest"/>
        <link rel="stylesheet" href="webpuyo.css"/>
        <script defer src="webpuyo.js"></script>
        <!-- // Game 관련 -->

        <!-- 게임 로딩 스크립트 -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const canvas = document.getElementById("webpuyo_canvas");
                // window.WebPuyo.setNoticeFile('https://hjow.github.io/puyow/src/notice.txt');
                // Initialize the game here
                window.WebPuyo.initialize(canvas);
            });
        </script>
    </head>
    <body class="webpuyo">
        <main>
            <canvas id="webpuyo_canvas" width="1280" height="720" aria-label="Web Puyo puzzle game"></canvas>
        </main>
    </body>
