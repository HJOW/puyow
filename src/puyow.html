        <!-- 게임 로딩 스크립트 -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const canvas = document.getElementById("webpuyo_canvas");
                // window.PuyoW.setNoticeFile('https://hjow.github.io/puyow/src/notice_[LANG].txt'); // 공지사항 URL을 변경
                window.PuyoW.initialize(canvas); // 게임 구동
            });
        </script>

    <body class="webpuyo">
        <main>
            <canvas id="webpuyo_canvas" width="1280" height="720" aria-label="Web Puyo puzzle game"></canvas>
