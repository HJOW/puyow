<html lang="ko">

        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="icon" type="image/png" sizes="45x45" href="./img/icon45.png"/>
        <title>Puyo W</title>

        <!-- manifest (이 webmanifest 가 있어야 PWA 앱으로도 설치할 수 있음, 없어도 게임 자체는 동작함) -->
        <link rel="manifest" href="manifest.webmanifest"/>

        <!-- FIREBASE (플레이에는 필요하지 않음, 선택사항) -->
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.19.0/firebase-performance-compat.js"></script>
        <!--<script defer src="/__/firebase/init.js?useEmulator=true"></script>-->
        <script defer src="./js/firebaseinit.js"></script>
        <!-- // FIREBASE -->

        <!-- Game 관련 (선택) -->
        <script defer src="./js/crypto-js.min.js"></script>
        <script defer src="./js/ort.all.min.js"></script>
        <!-- // Game 관련 (선택) -->

        <!-- Game 관련 (필수) -->
        <link rel="stylesheet" href="./css/puyow.css"/>
        <!-- puyow.js, puyow_3d.js 와 이들이 import 하는 json5.js, three.module.min.js, three.core.min.js 를 Webpack 으로 묶은 번들 (npm run build 로 생성) -->
        <script defer src="./bundle/puyow.bundle.js"></script>
        <!-- 번들 대신 ES Module 원본을 직접 쓸 때는 위 줄 대신 아래 세 줄을 사용 (import map 은 three.module.min.js 가 import 하는 ./three.core.js 를 연결한다) -->
        <!--<script type="importmap">{ "imports": { "./js/three.core.js": "./js/three.core.min.js" } }</script>-->
        <!--<script type="module" src="./js/puyow_3d.js"></script>-->
        <!--<script type="module" src="./js/puyow.js"></script>-->
        <!-- // Game 관련 (필수) -->

        <!-- 게임 로딩 스크립트 -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                // 게임 영역 준비
                const divTarget = document.getElementById("puyow_target");
                // window.PuyoW.setNoticeFile('https://hjow.github.io/puyow/src/notice/notice_[LANG].txt'); // 공지사항 URL을 변경

                // FIREBASE 초기화 (선택 사항)
                let analytics   = null;
                let performance = null;
                try { analytics   = firebase.analytics();   } catch(e) {}
                try { performance = firebase.performance(); } catch(e) {}

                // 게임 구동
                window.PuyoW.initialize(divTarget);
            });
        </script>
    </head>
    <body class="webpuyo">
        <div id="puyow_target" width="1280" height="720" aria-label="Web Puyo puzzle game"></div>
    </body>
</html>
